name: build

# main への Pull Request でビルド検証を実行する
on:
  pull_request:
    branches:
      - main

jobs:
  # root（オープンLLM / コンテナモード）: docker build でイメージを検証する。
  # serverless package はコンテナイメージ解決（ECR）が必要で CI 単体では完結
  # しないため、Dockerfile + requirements + app.py のインポートを docker build
  # で実際に検証する。
  container-build:
    name: docker build (open-llm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CI を軽量・高速にするため最小モデル（SmolLM2-135M）で検証する。
      - name: Download tiny model
        env:
          HF_REPO: bartowski/SmolLM2-135M-Instruct-GGUF
          HF_FILE: SmolLM2-135M-Instruct-Q4_K_M.gguf
        run: bash scripts/download_model.sh

      # CI ランナーは x86_64 のため linux/amd64 でネイティブビルド（QEMU 不要）。
      # llama-cpp-python のソースビルドが走るため数分かかる。
      - name: Docker build
        run: docker build --platform linux/amd64 -t ai-chat:ci .

  # gemini（zip デプロイ）: 従来どおり serverless package で検証する。
  serverless-package:
    name: serverless package (gemini)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # package*.json は .gitignore 対象のため、CI 内で必要なプラグインを直接インストールする
      # serverless v3 系のため、各プラグインも v3 対応バージョンに固定する
      # （serverless-offline の最新版は serverless@^4 を要求し peer 依存が衝突するため）
      - name: Install Serverless Framework and plugins
        working-directory: gemini
        run: npm install --legacy-peer-deps serverless@3 serverless-offline@13 serverless-python-requirements@6 serverless-better-credentials

      # useDotenv: true のため ${env:...} 解決用にダミーの .env を生成する（実値は不要・パッケージング検証のみ）
      - name: Create dummy .env
        working-directory: gemini
        run: |
          cat <<'EOF' > .env
          SLACK_SIGNING_SECRET=dummy
          SLACK_BOT_TOKEN=dummy
          GEMINI_API_KEY=dummy
          EOF

      - name: Build (serverless package)
        working-directory: gemini
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_REGION: us-east-1
        run: npx serverless package
